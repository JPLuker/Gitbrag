name: One-time Gitbrag 1.0.0 publication
on:
  push:
    branches: ['release/publish-v1.0.0']
    paths: ['.github/workflows/publish-v1.0.0.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'JPLuker/Gitbrag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 619824eb487b909bb5773bc6c00efe0abc6a8b23
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          test -s LICENSE
          python3 scripts/verify.py
          python3 scripts/package.py
          sha256sum -c dist/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          heading = '## [1.0.0]'
          assert heading in text, 'Missing changelog entry for release'
          section = text.split(heading, 1)[1].split('\n## ', 1)[0]
          notes = '\n'.join(section.splitlines()[1:]).strip()
          notes += '\n\n## Downloads\n- Gitbrag-1.0.0-Website.zip — static website\n- Gitbrag-1.0.0-Chrome.zip — unpacked Chrome-compatible extension\n- SHA256SUMS.txt — asset checksums\n'
          Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Create and publish v1.0.0
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/JPLuker/Gitbrag/git/ref/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 tag already exists. Refusing to overwrite it."
            exit 1
          fi
          gh api --method POST repos/JPLuker/Gitbrag/git/refs -f ref=refs/tags/v1.0.0 -f sha=619824eb487b909bb5773bc6c00efe0abc6a8b23
          gh release create v1.0.0 dist/Gitbrag-1.0.0-Website.zip dist/Gitbrag-1.0.0-Chrome.zip dist/SHA256SUMS.txt --repo JPLuker/Gitbrag --verify-tag --draft --title "Gitbrag v1.0.0" --notes-file dist/release-notes.md
          gh release view v1.0.0 --repo JPLuker/Gitbrag --json assets --jq '.assets | length == 3' | grep -qx 'true'
          gh release edit v1.0.0 --repo JPLuker/Gitbrag --draft=false --latest
