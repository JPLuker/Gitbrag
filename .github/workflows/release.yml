name: Prepare draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check tagged version and license
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -s LICENSE
      - run: python3 scripts/verify.py
      - run: python3 scripts/package.py
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          text = Path('CHANGELOG.md').read_text()
          heading = '## [' + version + ']'
          if heading not in text:
              raise SystemExit('Missing versioned changelog entry')
          section = text.split(heading, 1)[1].split('\n## ', 1)[0]
          notes = '\n'.join(section.splitlines()[1:]).strip()
          notes += '\n\n## Downloads\nWebsite: static site ZIP.\nChrome: unpacked extension ZIP.\nSHA256SUMS.txt: checksums for both ZIPs.\n'
          Path('dist/release-notes.md').write_text(notes)
          PY
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --draft --title "Gitbrag $GITHUB_REF_NAME" --notes-file dist/release-notes.md
