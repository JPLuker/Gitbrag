<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gitbrag</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">GIT<span>BRAG</span></div>
      <small>v0.9.8</small>
    </header>

    <label class="row toggle-row">
      <span><b>Show Gitbrag overlay</b><small>Add the Gitbrag snapshot to public GitHub profiles.</small></span>
      <input id="enabled" type="checkbox" checked>
    </label>

    <label class="field">
      <span>Default activity period</span>
      <select id="period">
        <option value="current-month">Current month</option>
        <option value="day">Last 24 hours</option>
        <option value="week">Last 7 days</option>
        <option value="month">Last 30 days</option>
        <option value="twomonths">Last 60 days</option>
        <option value="sixmonths">Last 6 months</option>
        <option value="year">Last year</option>
        <option value="lifetime">All time</option>
      </select>
    </label>

    <div class="actions">
      <button id="clearCache" type="button">Clear cached profiles</button>
      <a href="https://jpluker.github.io/Gitbrag/" target="_blank" rel="noopener noreferrer">Open Gitbrag ↗</a>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
